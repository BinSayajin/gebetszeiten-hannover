<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
    <title>Gebetszeiten Hannover</title>
    <link rel="stylesheet" href="widget.css">
    <script src="widget.js" defer></script>
  </head>
  <body>
    <main class="widget" data-theme="classic" aria-label="Gebetszeiten Hannover">
      <header class="header">
        <div class="arches" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="header-top">
          <div class="location"><img src="../assets/app.png" alt="" width="30" height="30">Hannover</div>
          <div class="controls">
            <button id="menu" class="icon-button" type="button" aria-label="Optionen" title="Optionen" aria-haspopup="menu"><span class="dots" aria-hidden="true"></span></button>
            <button id="hide" class="icon-button" type="button" aria-label="Widget ausblenden" title="Widget ausblenden"><span class="minus" aria-hidden="true"></span></button>
          </div>
        </div>
        <h1 id="title">Gebetszeiten</h1>
        <time id="date" class="date"></time>
      </header>

      <section class="current" aria-labelledby="current-label">
        <h2 id="current-label" class="eyebrow">Aktuell</h2>
        <div class="current-title" aria-live="polite" aria-atomic="true">
          <span id="current-name">Lade Zeiten …</span><time id="current-time" hidden></time>
          <span id="current-detail" hidden></span>
        </div>
      </section>

      <section class="next" aria-labelledby="next-label">
        <div>
          <h2 id="next-label" class="eyebrow">Nächstes Gebet</h2>
          <div class="next-title"><span id="next-name">—</span><span id="next-time" class="next-time" hidden></span></div>
        </div>
        <p id="next-countdown" class="countdown"></p>
      </section>

      <div class="schedule">
        <table id="schedule-table" aria-label="Heutige Gebetszeiten in Hannover" hidden>
          <thead><tr><th scope="col">Salah</th><th scope="col">Beginn</th><th scope="col">Jama’ah</th></tr></thead>
          <tbody id="prayer-rows"></tbody>
        </table>
        <div id="empty" class="empty" role="status">
          <p id="empty-message">Gebetszeiten werden geladen …</p>
          <button id="retry" class="retry" type="button" hidden>Erneut laden</button>
        </div>
      </div>

      <footer>
        <button id="source" class="source" type="button" title="Website von Lichter der Erkenntnis öffnen">Lichter der Erkenntnis<span class="external" aria-hidden="true">↗</span></button>
        <span id="source-status" class="status" hidden><i aria-hidden="true"></i><span id="source-label"></span></span>
      </footer>
    </main>
  </body>
</html>
